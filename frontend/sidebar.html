<!-- =========================================================
     STORESENSE SHARED SIDEBAR
     ========================================================= -->

<aside class="sidebar" id="storeSidebar">

    <!-- =====================================================
         BRAND
         ===================================================== -->

    <div class="sidebar-brand">

        <a href="/" class="sidebar-brand-link">

            <div class="sidebar-logo">
                S
            </div>

            <div class="sidebar-brand-text">

                <div class="sidebar-brand-name">
                    StoreSense
                </div>

                <div class="sidebar-brand-subtitle">
                    Retail Intelligence
                </div>

            </div>

        </a>


        <!-- DESKTOP COLLAPSE TOGGLE -->

        <button
            type="button"
            class="sidebar-collapse-button"
            id="sidebarCollapseButton"
            aria-label="Collapse sidebar"
            aria-expanded="true"
        >

            <span class="sidebar-collapse-icon">
                ‹
            </span>

        </button>

    </div>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <nav
        class="sidebar-navigation"
        aria-label="Main navigation"
    >

        <!-- =================================================
             WORKSPACE
             ================================================= -->

        <div class="sidebar-section">

            <div class="sidebar-section-label">
                Workspace
            </div>


            <!-- DASHBOARD -->

            <a
                href="/"
                class="sidebar-nav-item"
                data-page="dashboard"
            >

                <span class="sidebar-nav-icon">
                    <span class="icon-dashboard">
                        ⌂
                    </span>
                </span>

                <span class="sidebar-nav-text">
                    Dashboard
                </span>

            </a>


            <!-- DATA CENTER -->

            <a
                href="/data-center"
                class="sidebar-nav-item"
                data-page="data-center"
            >

                <span class="sidebar-nav-icon">
                    <span class="icon-data">
                        ▦
                    </span>
                </span>

                <span class="sidebar-nav-text">
                    Data Center
                </span>

            </a>


            <!-- INVENTORY -->

            <a
                href="/inventory"
                class="sidebar-nav-item"
                data-page="inventory"
            >

                <span class="sidebar-nav-icon">
                    <span class="icon-inventory">
                        □
                    </span>
                </span>

                <span class="sidebar-nav-text">
                    Inventory
                </span>

            </a>

        </div>


        <!-- =================================================
             INTELLIGENCE
             ================================================= -->

        <div class="sidebar-section">

            <div class="sidebar-section-label">
                Intelligence
            </div>


            <!-- AI COPILOT -->

            <a
                href="/#copilot"
                class="sidebar-nav-item"
                data-page="copilot"
            >

                <span class="sidebar-nav-icon">
                    <span class="icon-copilot">
                        ✦
                    </span>
                </span>

                <span class="sidebar-nav-text">
                    AI Copilot
                </span>

            </a>

        </div>

    </nav>


    <!-- =====================================================
         SIDEBAR FOOTER
         ===================================================== -->

    <div class="sidebar-footer">


        <!-- =================================================
             LOGGED-IN USER
             ================================================= -->

        <div
            class="sidebar-user-card"
            id="sidebarUserCard"
        >

            <!-- USER AVATAR -->

            <div
                class="sidebar-user-avatar"
                id="sidebarUserAvatar"
                aria-hidden="true"
            >
                U
            </div>


            <!-- USER INFORMATION -->

            <div class="sidebar-user-info">

                <!-- NAME -->

                <div
                    class="sidebar-user-name"
                    id="sidebarUserName"
                    title="User"
                >
                    User
                </div>


                <!-- EMAIL -->

                <div
                    class="sidebar-user-email"
                    id="sidebarUserEmail"
                    title="user@example.com"
                >
                    user@example.com
                </div>

            </div>

        </div>


        <!-- =================================================
             LOGOUT
             ================================================= -->

        <button
            type="button"
            class="sidebar-logout-button"
            id="sidebarLogoutButton"
            aria-label="Logout"
        >

            <span
                class="sidebar-logout-icon"
                aria-hidden="true"
            >
                ↪
            </span>

            <span class="sidebar-nav-text">
                Logout
            </span>

        </button>


        <!-- =================================================
             SYSTEM STATUS
             ================================================= -->

        <div class="sidebar-status-card">

            <span
                class="sidebar-status-dot"
                aria-hidden="true"
            ></span>


            <div class="sidebar-status-content">

                <div class="sidebar-status-title">
                    System status
                </div>

                <div
                    class="sidebar-status-text"
                    id="sidebarStatus"
                >
                    Connected
                </div>

            </div>

        </div>


        <!-- =================================================
             POWERED BY
             ================================================= -->

        <div class="sidebar-powered">
            StoreSense Intelligence
        </div>

    </div>

</aside>


<!-- =========================================================
     MOBILE HEADER
     ========================================================= -->

<header class="mobile-sidebar-header">

    <!-- MOBILE MENU BUTTON -->

    <button
        type="button"
        class="mobile-sidebar-toggle"
        id="mobileSidebarToggle"
        aria-label="Open navigation"
        aria-expanded="false"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- MOBILE BRAND -->

    <a
        href="/"
        class="mobile-sidebar-brand"
    >

        <span class="mobile-sidebar-logo">
            S
        </span>


        <span class="mobile-sidebar-brand-text">

            <span class="mobile-sidebar-brand-name">
                StoreSense
            </span>

            <span class="mobile-sidebar-brand-subtitle">
                Retail Intelligence
            </span>

        </span>

    </a>

</header>


<!-- =========================================================
     MOBILE OVERLAY
     ========================================================= -->

<div
    class="sidebar-overlay"
    id="sidebarOverlay"
    aria-hidden="true"
></div>
